name: 📲 Daily IT News – Instagram (Farsi)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install Python packages
        run: pip install -r requirements.txt

      - name: 🔤 Download Farsi font
        run: |
          mkdir -p fonts
          FONT_URL=$(curl -s https://api.github.com/repos/rastikerdar/vazirmatn/releases/latest \
            | grep "browser_download_url.*font-files.zip" \
            | cut -d '"' -f 4)
          echo "Downloading font from: $FONT_URL"
          curl -fsSL "$FONT_URL" -o vazirmatn.zip
          unzip -jo vazirmatn.zip "*.ttf" -d fonts/
          ls fonts/

      - name: 🚀 Post to Instagram
        env:
          NEWS_API_KEY:           ${{ secrets.NEWS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMGBB_API_KEY:          ${{ secrets.IMGBB_API_KEY }}
        run: python post_news.py

      - name: 🖼️ Save post image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-image-${{ github.run_number }}
          path: post.jpg
          retention-days: 7
